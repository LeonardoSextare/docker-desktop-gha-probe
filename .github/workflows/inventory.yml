name: inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inventory (PowerShell 7)
        shell: pwsh
        run: ./scripts/inventory.ps1 -OutFile inventory-pwsh.txt

      - name: Inventory (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/inventory.ps1 -OutFile inventory-powershell.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: inventory-${{ github.run_id }}
          path: inventory-*.txt
